name: Wave 0 Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck Wave 0 dependency path
        run: pnpm --filter '@hybrid/maps-api-contract-tests...' -r build

      - name: Run characterization and related package tests
        run: pnpm --filter '@hybrid/maps-api-contract-tests...' -r test

      - name: Verify API contract fixtures explicitly
        run: pnpm --filter @hybrid/maps-api-contract-tests test
