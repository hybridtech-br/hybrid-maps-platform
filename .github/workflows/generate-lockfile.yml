name: Generate PNPM Lockfile

on:
  push:
    branches: [feat/hgk-foundation]
    paths:
      - package.json
      - packages/**/package.json
      - apps/**/package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hgk-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "HYBRID Release Bot"
          git config user.email "contato@hybridtech.com.br"
          git add pnpm-lock.yaml
          git commit -m "chore(release): add reproducible pnpm lockfile"
          git push origin HEAD:feat/hgk-foundation
